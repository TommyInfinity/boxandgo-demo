<!doctype html>
<html lang="hu" data-demo-admin="1">
<head>
  <meta charset="utf-8">
  <base href="../">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Box & Go – Admin</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin/admin.css">
</head>
<body>
  <!-- Belépés -->
  <section class="login" id="login" hidden>
    <form class="login-card" id="loginForm">
      <img src="img/logo.webp" alt="Box & Go" class="login-logo">
      <h1>Admin belépés</h1>
      <label>Felhasználónév<input name="user" value="admin" autocomplete="username" required></label>
      <label>Jelszó<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn primary" type="submit">Belépés</button>
      <p class="err" id="loginErr" role="alert"></p>
      <a href="./" class="back">← Vissza a weboldalra</a>
    </form>
  </section>

  <!-- Admin -->
  <div class="app" id="app" hidden>
    <aside class="side">
      <a href="./" class="side-logo" target="_blank" rel="noopener"><img src="img/logo.webp" alt="Box & Go"></a>
      <nav id="tabs"></nav>
      <div class="side-foot">
        <a href="./" target="_blank" rel="noopener" class="btn ghost sm">Weboldal megnyitása ↗</a>
        <button class="btn ghost sm" id="logout">Kijelentkezés</button>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="Menü">☰</button>
        <h1 id="tabTitle"></h1>
        <div class="top-actions">
          <span class="dirty" id="dirty" hidden>● Nem mentett változások</span>
          <button class="btn primary" id="save" disabled>Mentés</button>
        </div>
      </header>
      <div class="notice" id="pwNotice" hidden>
        <b>Biztonság:</b> még a kezdő jelszót használod. <a href="#" data-goto="account">Változtasd meg most →</a>
      </div>
      <div class="content" id="content"></div>
    </main>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <script src="js/demo-api.js"></script>
  <script src="admin/admin.js"></script>
</body>
</html>
